# Dataset registry for ckan_ingest.py
#
# Each entry describes one CKAN dataset. Adding a dataset = adding an entry.
#
# Required keys:  key, domain, ckan_id, update_pattern, status, purpose
# Optional keys:  source, base_url, languages, formats, name_regex, description
#
# status:
#   candidate   registered but not ingested yet (under evaluation)
#   active      ingested by run_ingestion
#   deprecated  kept for the record, no longer ingested
# Discovery (tools/discover_datasets) treats an entry of any status as registered.
#
# purpose: why the dataset is wanted and where it will be used. An active entry
# must not start with "TODO" (the placeholder discovery writes into drafts).
#
# update_pattern:
#   new_file_per_period  publisher adds a new file each period
#   overwrite_in_place   publisher replaces the same file; every version is
#                        kept as a snapshot (feeds AUTO CDC FROM SNAPSHOT)

defaults:
  source: open_canada
  base_url: https://open.canada.ca/data/api/3/action
  languages: [en]

datasets:
  # --- Immigration: active -------------------------------------------------
  - key: lmia_positive_employers
    domain: immigration
    ckan_id: 90fed587-1364-4f33-a9ee-208181dc0b97
    update_pattern: new_file_per_period
    status: active
    purpose: >
      Employers issued positive LMIAs under the Temporary Foreign Worker
      Program: which employers and sectors recruit foreign workers in each
      province. Feeds the labour-demand metrics of the immigration domain.
    formats: [CSV, XLSX, XLS]
    description: >
      ESDC TFWP Positive LMIA Employers List. Quarterly; each quarter adds new
      resources (confirmed). CSV until 2020Q3, XLSX afterwards.

  - key: esdc_lmia_negative_employers
    domain: immigration
    ckan_id: f82f66f2-a22b-4511-bccf-e1d74db39ae5
    update_pattern: new_file_per_period
    status: active
    purpose: >
      Employers refused LMIAs: the counterpart of the positive list, giving
      approval-versus-refusal context by province.
    formats: [CSV, XLSX, XLS]
    description: >
      ESDC TFWP Negative LMIA Employers List. Quarterly; each quarter adds new
      resources (confirmed).

  - key: esdc_lmia_statistics_quarterly
    domain: immigration
    ckan_id: e8745429-21e7-4a73-b3f5-90a779b78d1e
    update_pattern: overwrite_in_place
    status: active
    purpose: >
      Quarterly LMIA statistics (positions, program streams, occupations,
      province): recent provincial trends in temporary foreign worker demand,
      including Manitoba.
    formats: [CSV]
    description: >
      ESDC TFWP LMIA Statistics, quarterly tables. Every CSV resource has a
      last_modified (17 of 17 on 2026-10-31), later than its creation date, so
      resources are replaced in place; versions use last_modified.

  - key: esdc_lmia_statistics_annual
    domain: immigration
    ckan_id: 76defa14-473e-41e2-abfa-60021c4d934b
    update_pattern: overwrite_in_place
    status: active
    purpose: >
      Annual LMIA statistics tables: longer history (from 2016) to complement
      the quarterly tables.
    formats: [CSV, XLSX]
    description: >
      ESDC TFWP LMIA Statistics, annual tables. Every CSV resource has a
      last_modified (4 of 4 on 2026-10-31), later than its creation date, so
      resources are replaced in place; versions use last_modified. XLSX is
      selected too (ADR 0005): the 4 CSV tables (5, 8, 17, 24) are the archived
      ones, and at least 20 tables are only published as XLSX. The XLSX
      resources carry last_modified as well (24 of 24 on 2026-11-02).

  - key: ircc_permanent_residents_monthly
    domain: immigration
    ckan_id: f7e5498e-0ad8-4417-85c9-9b8aff9b9eda
    update_pattern: overwrite_in_place
    status: active
    purpose: >
      Permanent residents by province/territory, immigration category and
      country of citizenship: the core metrics on who immigrates to Manitoba
      and from where.
    formats: [CSV, XLSX]
    description: >
      IRCC Permanent Residents - Monthly IRCC Updates. Every CSV table is
      ingested (no name filter). Confirmed: updated in place; resources have no
      last_modified, so versions are content hashes (sha256-...). XLSX is
      selected too (ADR 0005): at least 2 tables are only published as XLSX.
      The XLSX resources have no last_modified either (0 of 18 on 2026-11-02),
      so they are downloaded on every run.

  - key: ircc_study_permit_holders_monthly
    domain: immigration
    ckan_id: 90115b00-f9b8-49e8-afa3-b4cff8facaee
    update_pattern: overwrite_in_place
    status: active
    purpose: >
      Study permit holders by province, study level and country of
      citizenship: international student numbers for Manitoba.
    formats: [CSV, XLSX, XLS]
    description: >
      IRCC Temporary Residents - Study Permit Holders (monthly). Confirmed:
      updated in place; resources have no last_modified, so versions are
      content hashes (sha256-...). XLSX is selected too (ADR 0005): at least 3
      tables are only published as XLSX. XLS is selected as well: its 3
      resources are marked [ARCHIVED] (no longer updated), but two of them
      (citizenship, census metropolitan area) have no similarly named CSV or
      XLSX resource, so they are probably the only copy of that history. The
      XLSX and XLS resources have no last_modified either (0 of 9 and 0 of 3 on
      2026-11-02), so they are downloaded on every run.

  - key: ircc_work_permit_holders_monthly
    domain: immigration
    ckan_id: 360024f2-17e9-4558-bfc1-3616485d65b9
    update_pattern: overwrite_in_place
    status: active
    purpose: >
      TFWP and International Mobility Program work permit holders by province,
      occupational skill level and country: temporary workers in Manitoba.
    formats: [CSV, XLSX]
    description: >
      IRCC Temporary Residents - Work Permit Holders (monthly). Confirmed:
      updated in place; resources have no last_modified, so versions are
      content hashes (sha256-...). XLSX is selected too (ADR 0005): at least 6
      tables are only published as XLSX. The XLSX resources have no
      last_modified either (0 of 19 on 2026-11-02), so they are downloaded on
      every run.

  - key: ircc_tr_to_pr_transition_monthly
    domain: immigration
    ckan_id: 1b026aab-edb3-4d5d-8231-270a09ed4e82
    update_pattern: overwrite_in_place
    status: active
    purpose: >
      Permanent residents with prior study or work permit status, by province
      and category: the pathways from temporary to permanent residence.
    formats: [CSV]
    description: >
      IRCC Transition from Temporary Resident to Permanent Resident Status
      (monthly). Confirmed: updated in place; resources have no last_modified,
      so versions are content hashes (sha256-...).

  # --- Immigration: candidate (registered, not ingested yet) ---------------
  - key: ircc_asylum_claimants_monthly
    domain: immigration
    ckan_id: b6cbcf4d-f763-4924-a2fb-8cc4a06e3de4
    update_pattern: overwrite_in_place
    status: candidate
    purpose: >
      Asylum claimants by province and country: evaluate once the core
      immigration datasets work end to end.
    formats: [CSV]
    description: >
      IRCC Asylum Claimants (monthly). Assumed to behave like the active IRCC
      monthly datasets (updated in place, last_modified mostly empty); confirm
      when it becomes active.

  - key: irb_rpd_decisions
    domain: immigration
    ckan_id: 6e47f705-71ed-41f0-8fd5-d1a8508a3b63
    update_pattern: new_file_per_period
    status: candidate
    purpose: >
      Refugee Protection Division decisions: refugee protection outcomes;
      evaluate whether they add provincial insight.
    formats: [CSV]
    description: >
      Immigration and Refugee Board RPD Decisions (quarterly), published on
      open.canada.ca. update_pattern to be confirmed after the first
      ingestion, from the resources' last_modified.

  - key: ircc_express_entry_pr_monthly
    domain: immigration
    ckan_id: 52e4b14b-597a-4ecf-a184-23a6e69b0d57
    update_pattern: overwrite_in_place
    status: candidate
    purpose: >
      Permanent residents admitted through Express Entry, by province and
      category: evaluate as a pathway breakdown of permanent residence.
    formats: [CSV]
    description: >
      IRCC Express Entry Permanent Residents (monthly). Assumed to behave like
      the active IRCC monthly datasets (updated in place, last_modified
      empty); confirm when it becomes active.

  - key: ircc_express_entry_invitations_monthly
    domain: immigration
    ckan_id: 593e9165-c6ce-4f9b-b519-03d315f92cd4
    update_pattern: overwrite_in_place
    status: candidate
    purpose: >
      Express Entry candidates invited, by province, category and score:
      evaluate as a leading indicator of permanent residence.
    formats: [CSV]
    description: >
      IRCC Express Entry-Invited Candidates (monthly). Assumed to behave like
      the active IRCC monthly datasets (updated in place, last_modified
      empty); confirm when it becomes active.

  - key: ircc_glossaries
    domain: immigration
    ckan_id: 17f69360-123a-4bd2-8eef-bba94468071f
    update_pattern: overwrite_in_place
    status: candidate
    purpose: >
      IRCC program glossaries: reference for writing column comments on the
      IRCC tables. Not analytical data.
    formats: [CSV]
    description: >
      IRCC Glossaries (citizenship and visitors programs). Assumed to behave
      like the active IRCC monthly datasets (updated in place); confirm when it
      becomes active.
